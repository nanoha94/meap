services:
    nginx:
        image: "nginx:latest"
        ports:
            - "127.0.0.1:${APP_PORT:-8000}:8000"
            - "127.0.0.1:${PGADMIN_PORT:-8080}:8080"
        environment:
            - SSL_PORT=${APP_PORT:-8000}
            - APP_SERVICE=${APP_SERVICE:-laravel.test}
            - SERVER_NAME=${APP_SERVER_NAME:-localhost}
            - SSL_DOMAIN=${APP_SSL_DOMAIN:-localhost}
            - SSL_ALT_NAME=${APP_SSL_ALT_NAME:-DNS:localhost}
        volumes:
            - "../certificates/localhost-key.pem:/etc/certs/localhost-key.pem"
            - "../certificates/localhost.pem:/etc/certs/localhost.pem"
            - "./docker/nginx/conf.d:/etc/nginx/conf.d"
            - "sail-nginx:/etc/nginx/certs"
            - "./vendor/ryoluo/sail-ssl/nginx/templates:/etc/nginx/templates"
            - "./vendor/ryoluo/sail-ssl/nginx/generate-ssl-cert.sh:/docker-entrypoint.d/99-generate-ssl-cert.sh"
            - .:/var/www/html
            - /dev/null:/etc/nginx/conf.d/default.conf
        depends_on:
            - ${APP_SERVICE:-laravel.test}
            - pgadmin
        networks:
            - sail
    laravel.test:
        build:
            context: "./docker/8.3"
            dockerfile: Dockerfile.local
            args:
                WWWGROUP: "${WWWGROUP}"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "127.0.0.1:${APP_HTTP_PORT:-8001}:80"
            - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
        environment:
            WWWUSER: "${WWWUSER}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - ".:/var/www/html"
            - "./docker/8.3/php.ini:/etc/php/8.3/cli/conf.d/99-sail.ini"
        networks:
            - sail
        depends_on:
            - db
            - redis
            - meilisearch
            - mailpit
            - selenium
    db:
        image: "postgres:17"
        ports:
            - "127.0.0.1:${FORWARD_DB_PORT:-5432}:5432"
        environment:
            PGPASSWORD: "${DB_PASSWORD}"
            POSTGRES_DB: "${DB_DATABASE}"
            POSTGRES_USER: "${DB_USERNAME}"
            POSTGRES_PASSWORD: "${DB_PASSWORD}"
        volumes:
            - "sail-pgsql:/var/lib/postgresql/data"
            - "./docker/pgsql/create-testing-database.sh:/docker-entrypoint-initdb.d/create-testing-database.sh"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - "-q"
                - "-d"
                - "${DB_DATABASE}"
                - "-U"
                - "${DB_USERNAME}"
            retries: 3
            timeout: 5s
    pgadmin:
        image: dpage/pgadmin4:latest
        environment:
            PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@example.com}"
            PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD}"
            PGADMIN_CONFIG_SERVER_MODE: "False"
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
        volumes:
            - "sail-pgadmin:/var/lib/pgadmin"
            - "./docker/pgadmin/servers.json:/pgadmin4/servers.json"
        networks:
            - sail
    redis:
        image: "redis:alpine"
        ports:
            - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - "sail-redis:/data"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    meilisearch:
        image: "getmeili/meilisearch:latest"
        ports:
            - "127.0.0.1:${FORWARD_MEILISEARCH_PORT:-7700}:7700"
        environment:
            MEILI_NO_ANALYTICS: "${MEILISEARCH_NO_ANALYTICS:-false}"
        volumes:
            - "sail-meilisearch:/meili_data"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - wget
                - "--no-verbose"
                - "--spider"
                - "http://127.0.0.1:7700/health"
            retries: 3
            timeout: 5s
    mailpit:
        image: "axllent/mailpit:latest"
        ports:
            - "127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025"
            - "127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
        networks:
            - sail
    selenium:
        image: selenium/standalone-chromium
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - "/dev/shm:/dev/shm"
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-nginx:
        driver: local
    sail-pgsql:
        driver: local
    sail-pgadmin:
        driver: local
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
